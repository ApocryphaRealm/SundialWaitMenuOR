; Sundial Wait Menu (Oblivion Remastered). Read when the game starts.

[General]
; 1 = the wait and sleep menu is drawn as the dial. 0 leaves the game's own menu exactly as it is.
bEnabled=1

[Dial]
; The dial's diameter, its rim and the four marks included, in the menu's own units (pixels at 1080p).
uSize=680
; The gap between the menu's title and the top of the dial.
uTitleGap=10
; The gap between the bottom of the dial and the menu's buttons.
uButtonGap=14
; 1 = the hours, the time and the date on the face are written in brown ink (the game's light text is hard to read on
; the paper). 0 keeps the game's own colour.
bInkText=1

[Log]
; 0 trace, 1 debug, 2 info, 3 warnings, 4 errors, 5 critical, 6 off. Use 1 when reporting a problem.
uLogLevel=2
